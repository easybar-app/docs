site_name: EasyBar
site_description: EasyBar apps, Lua widgets, packages, command-line tools, and shared platform documentation.
site_url: https://easybar.dev/

repo_url: https://github.com/easybar-app/docs
repo_name: easybar-app/docs
edit_uri: edit/main/content/

docs_dir: content
site_dir: .site

theme:
  name: material
  logo: assets/icons/apple-touch-icon.png
  favicon: assets/icons/favicon-64x64.png
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.footer
    - navigation.tracking
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.select

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - awesome-nav

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
